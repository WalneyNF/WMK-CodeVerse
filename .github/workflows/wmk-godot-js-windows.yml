name: WMK CodeVerse - Migracao Godot 4.7.2
on:
  workflow_dispatch:
  push:
    branches: [wmk-godot-4.7-upgrade]
    paths:
      - "wmk-js/**"
      - "wmk-language-kit/**"
      - "wmk-portugol/**"
      - "branding/**"
      - ".github/workflows/wmk-godot-js-windows.yml"
concurrency:
  group: wmk-codeverse-godot-4-7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  windows-editor:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Instalar SCons
        shell: pwsh
        run: python -m pip install "scons>=4.7,<5"
      - name: Conferir ferramentas
        shell: pwsh
        run: |
          python --version
          dotnet --version
          node --version
          pnpm --version
          scons --version
      - name: Verificar sintaxe do migrador ClassDB
        shell: pwsh
        run: |
          python -m py_compile ./wmk-js/compat-classdb-4.7.py ./wmk-js/compat-object-bindings-4.7.py

      - name: Compilar Godot com .NET JS e TS
        shell: pwsh
        run: ./wmk-js/build-five-languages.ps1 -WorkDir "$env:RUNNER_TEMP/wmk-five-languages" -Jobs 2
      - name: Testar JavaScript com cena real
        shell: pwsh
        run: ./wmk-js/test-js.ps1 -Distribution "$env:RUNNER_TEMP/wmk-five-languages/WMK-Godot-Five-Languages"
      - name: Testar Playground JS 2D e 3D
        shell: pwsh
        run: ./wmk-js/test-playground.ps1 -Distribution "$env:RUNNER_TEMP/wmk-five-languages/WMK-Godot-Five-Languages"
      - name: Adicionar Lua 5.4 no projeto-modelo
        shell: pwsh
        run: ./wmk-js/install-lua.ps1 -Distribution "$env:RUNNER_TEMP/wmk-five-languages/WMK-Godot-Five-Languages" -LuaVersion "0.8.2"
      - name: Testar execucao Lua com diagnosticos e cena real
        shell: pwsh
        run: ./wmk-js/test-lua.ps1 -Distribution "$env:RUNNER_TEMP/wmk-five-languages/WMK-Godot-Five-Languages"
      - name: Copiar exemplos Playground para distribuicao
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP/wmk-five-languages/WMK-Godot-Five-Languages"
          if (Test-Path $dest) { Copy-Item "./wmk-js/playground" (Join-Path $dest "WMK-JS-Playground") -Recurse -Force }
      - name: Copiar instalador de linguagens WMK e manuais
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP/wmk-five-languages/WMK-Godot-Five-Languages"
          if (Test-Path $dest) {
            Copy-Item "./wmk-language-kit" (Join-Path $dest "WMK-Language-Kit") -Recurse -Force
            Copy-Item "./wmk-portugol" (Join-Path $dest "WMK-Portugol") -Recurse -Force
          }

      - name: Publicar pacote experimental para diagnostico
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WMK-CodeVerse-4.7.2-Windows-Experimental
          path: ${{ runner.temp }}/wmk-five-languages/WMK-Godot-Five-Languages/
          if-no-files-found: warn
          retention-days: 14
